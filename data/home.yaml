about:
  sectionLabel: "Profile & Mindset"
  photoBadge: 中国 · 杭州
  timezoneBadge: UTC+8
  quote: 半年前觉得优雅的实现，今天再看总有更好的解法。认知在演进，代码却停留在写下的那一刻。所以我忠实地记录着当时理解问题的方式，把每次在系统设计上的取舍、复盘的结论都写下来。—— 代码是当下认知的产物，笔记是与未来自己的持续对话
  title: 从后端深耕，到全栈与 AI 应用的持续演进
  paragraphs:
    - 你好，我是 Paul，坐标杭州。6 年后端 + 2 年全栈：在东莞银行做过互联网直销放贷系统与网关架构升级，在阿里巴巴速卖通参与自营商品从零建设、主导货品系统向供应链中台迁移，也在 AI 创业公司担任过技术负责人。
    - 在亿级数据、上万 QPS 的系统上主导数据迁移、查询优化与架构升级，对系统稳定性有切身理解；近两年转型全栈，日常重度使用 Coding Agent、Design Agent 等 AI 工具链。这个博客记录我在源码阅读、线上问题复盘与技术选型中的真实思考——不追求完美定稿，追求持续演进。
  # 核心聚焦方向（3 个小卡片）
  focus:
    - icon: coffee
      title: 高并发系统设计
      desc: 亿级数据、万级 QPS 系统的稳定性设计与实践、架构升级与工程性能优化。
    - icon: deployed_code
      title: 全栈与出海业务
      desc: 小程序与海外 APP 从零到一，打通跨境收单、结汇资金链路。
    - icon: smart_toy
      title: AI 工程实践
      desc: 用 Coding Agent、Design Agent 等 AI 工具链重塑日常开发与交付方式。
  # System Prompt 卡片（个性签名式展示）
  systemPrompt:
    version: Paul v2.0
    text: 角色设定：后端出身的全栈工程师，务实严谨。先理解业务再动手设计，用证据与数据说话；主导过亿级系统的数据迁移与架构升级，对稳定性有本能警觉；写作偏好源码佐证与复盘视角，优先以最小复杂度解决真实问题。

experience:
