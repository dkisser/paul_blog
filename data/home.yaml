  title: 从业务开发到云原生实践的持续沉淀
  paragraphs:
    - 你好，我是 Paul。一名后端工程师，日常工作围绕 Java 生态、微服务架构与云原生基础设施展开。
    - 我相信文字是最好的知识复利。这个博客记录我在源码阅读、线上问题复盘与技术选型中的真实思考——不追求完美定稿，追求持续演进。
  # 核心聚焦方向（3 个小卡片）
  focus:
