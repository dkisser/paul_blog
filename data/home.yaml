      title: Java 与微服务
      desc: Spring 生态、服务治理与高并发后端的工程实践。
    - icon: deployed_code
      title: 云原生基础设施
      desc: 容器化、Kubernetes 与服务可观测性体系建设。
    - icon: menu_book
      title: 源码与复盘
      desc: 通过源码阅读理解设计取舍，用复盘沉淀方法论。
  # System Prompt 卡片（个性签名式展示；TODO: 改成自己的版本）
