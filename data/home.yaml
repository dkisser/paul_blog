  title: 经历
  # 每条：period / role / org / desc / highlights / tech(标签)
  items:
    - period: 2024.12 — 至今
      role: 全栈开发
      org: 杭州旭耶科技 · 跨境 B2B 创业团队
      desc: 跨境 B2B 交易平台从零到一的全栈建设，覆盖交易链路、卖家工作台与商家运营工具体系。
      highlights:
        - 打通下单、商家发货、平台履约的交易全链路
        - 重构卖家前端站点（商品、卖家两大模块）
        - 从零构建运营站点
        - 基于 OpenClaw + Playwright 搭建选品、铺货、广告投流、员工效率统计工具
      tech: [Java, Python, React, Playwright, Spring Cloud]
    - period: 2024.04 — 2024.11
      role: 技术负责人
      org: 杭州极匠科技 · AI 创业团队
      desc: 从零到一帮助团队搭建微信小程序、Web、APP，统筹 CR、故障复盘、进度跟踪等研发流程管理。
      highlights:
        - 打通海外收单、结汇全资金链路，设计 T+7 资金回流方案，iOS 端上线美国市场
        - 从零搭建小说推文业务链路，收敛收益计算模型，新渠道平台接入压缩至 2 天
      tech: [JavaScript, Java, 微信小程序, 跨境支付]
    - period: 2021.06 — 2024.03
      role: 应用开发工程师
      org: 阿里巴巴 · 速卖通 AliExpress
      desc: 参与速卖通自营业务的供给、销售经营与供应链货品等系统的从零建设，主导速卖通货品系统的架构升级以及向供应链中台的迁移。
      highlights:
        - 主导全托管商货融合、半托管升级的方案设计，按租户维度抽象通用能力，兼任货品域 PM
        - 主导 2 亿+ SKU 商货关系单表的分库分表迁移与搜索灰度切流，沉淀通用消息重投组件
        - 设计竞品价格力离线数据回流链路：维度聚合 + 消息触发 + Redis 队列控频
        - 从零到一建设自营销售/供货商品运营管理端，沉淀行业侧通用 Excel 导出方案
      tech: [Java, 微服务, 分库分表, 消息队列]
    - period: 2019.05 — 2021.05
      role: 开发工程师
      org: 深圳长亮科技 · 东莞银行直销银行团队
      desc: 负责直销银行门户网关与开放平台建设，制定工程分层规范并沉淀文档，降低系统迭代成本。
      highlights:
        - 作为 PM 主导老网关向 Spring Cloud 体系升级与全链路压测，完成基金申赎、车位贷、小微贷等业务迁移
        - 设计开放平台 SOAP 协议接入：协议/报文/加密/业务分层抽象，以 SPI 支持业务定制扩展
      tech: [Java, Spring Cloud, 网关, SPI]

