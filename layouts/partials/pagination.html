{{/* 分页条：页数 >1 时渲染；样式用 chip 系，当前页高亮 */}}
{{ if gt .TotalPages 1 }}
  {{ $p := . }}
  <nav class="mt-12 flex flex-wrap items-center justify-center gap-2 font-mono text-xs" aria-label="分页">
    {{ if $p.HasPrev }}
      <a href="{{ $p.Prev.URL }}" class="chip chip-neutral inline-flex items-center gap-1 transition-colors hover:border-primary/60 hover:text-primary">
        <span class="material-symbols-outlined text-sm">chevron_left</span>上一页
      </a>
    {{ end }}
    {{ range $p.Pagers }}
      {{ if eq . $p }}
        <span class="chip border-primary/40 bg-primary-soft text-primary" aria-current="page">{{ .PageNumber }}</span>
      {{ else }}
        <a href="{{ .URL }}" class="chip chip-neutral transition-colors hover:border-primary/60 hover:text-primary">{{ .PageNumber }}</a>
      {{ end }}
    {{ end }}
    {{ if $p.HasNext }}
      <a href="{{ $p.Next.URL }}" class="chip chip-neutral inline-flex items-center gap-1 transition-colors hover:border-primary/60 hover:text-primary">
        下一页<span class="material-symbols-outlined text-sm">chevron_right</span>
      </a>
    {{ end }}
  </nav>
{{ end }}
