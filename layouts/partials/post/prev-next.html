{{/* 上一篇 / 下一篇 */}}
{{ if or .PrevInSection .NextInSection }}
  <nav class="mt-8 grid gap-4 sm:grid-cols-2" aria-label="上下篇导航">
    {{ with .PrevInSection }}
      <a href="{{ .RelPermalink }}" class="card card-hover group p-5">
        <span class="inline-flex items-center gap-1 font-mono text-xs text-subtle">
          <span class="material-symbols-outlined text-sm">arrow_back</span>上一篇
        </span>
        <p class="mt-2 line-clamp-1 text-sm font-semibold text-main transition-colors group-hover:text-primary">{{ .Title }}</p>
      </a>
    {{ else }}
      <span></span>
    {{ end }}
    {{ with .NextInSection }}
      <a href="{{ .RelPermalink }}" class="card card-hover group p-5 text-right">
        <span class="inline-flex items-center gap-1 font-mono text-xs text-subtle">
          下一篇<span class="material-symbols-outlined text-sm">arrow_forward</span>
        </span>
        <p class="mt-2 line-clamp-1 text-sm font-semibold text-main transition-colors group-hover:text-primary">{{ .Title }}</p>
      </a>
    {{ end }}
  </nav>
{{ end }}
