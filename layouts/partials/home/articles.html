{{/* #articles：最新 3 篇文章卡（卡片 partial 与列表页共用） */}}
{{ $posts := first 3 (where site.RegularPages "Type" "posts").ByDate.Reverse }}
<section id="articles" class="w-full scroll-mt-20">
  <div class="mx-auto w-full max-w-wide px-6 py-16 sm:py-20 lg:px-12">
    <div class="flex flex-wrap items-baseline gap-x-4 gap-y-1">
      <h2 class="text-2xl font-bold tracking-tight text-main sm:text-3xl">近期文章</h2>
      <p class="section-label min-w-40 flex-1">Selected Publications</p>
    </div>
    <div class="mt-4 flex justify-end">
      <a href="/posts/" class="chip transition-colors hover:border-primary/60">
        查看全部 {{ len (where site.RegularPages "Type" "posts") }} 篇
        <span class="material-symbols-outlined text-sm">arrow_forward</span>
      </a>
    </div>
    <div class="mt-10 grid grid-cols-1 gap-6 lg:grid-cols-3">
      {{ range $posts }}
        {{ partial "post/card.html" . }}
      {{ end }}
    </div>
  </div>
</section>
