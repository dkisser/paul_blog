{{/* 单个分类/标签页：该 term 下的文章卡网格 */}}
{{ define "main" }}
<div class="mx-auto w-full max-w-wide px-6 py-14 lg:px-12">
  <header class="max-w-2xl">
    <p class="section-label">// {{ .Data.Singular | humanize }}</p>
    <h1 class="mt-3 text-3xl font-bold tracking-tight text-main sm:text-4xl">{{ .Title }}</h1>
    <p class="mt-3 text-sm text-muted">共 {{ len .Pages }} 篇。</p>
  </header>
  <div class="mt-10 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    {{ range .Pages.ByDate.Reverse }}
      {{ partial "post/card.html" . }}
    {{ end }}
  </div>
</div>
{{ end }}
