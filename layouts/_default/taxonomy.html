{{/* 分类/标签总览页：所有 term 以 chip 云展示 */}}
{{ define "main" }}
<div class="mx-auto w-full max-w-3xl px-6 py-14">
  <p class="section-label">// {{ .Data.Plural | humanize }}</p>
  <h1 class="mt-3 text-3xl font-bold tracking-tight text-main sm:text-4xl">{{ .Title }}</h1>
  <div class="mt-8 flex flex-wrap gap-3">
    {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="chip chip-neutral transition-colors hover:border-primary/60 hover:text-primary">
        {{ .Title }}
        <span class="text-subtle">{{ len .Pages }}</span>
      </a>
    {{ end }}
  </div>
</div>
{{ end }}
