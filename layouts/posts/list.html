{{ define "main" }}
<div class="mx-auto w-full max-w-wide px-6 py-14 lg:px-12">
  <header class="max-w-2xl">
    <p class="section-label">// Posts</p>
    <h1 class="mt-3 text-3xl font-bold tracking-tight text-main sm:text-4xl">全部文章</h1>
    <p class="mt-3 text-sm text-muted">共 {{ len .RegularPages }} 篇，按发布时间倒序。</p>
  </header>
  {{ $paginator := .Paginate .RegularPages }}
  <div class="mt-10 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    {{ range $paginator.Pages }}
      {{ partial "post/card.html" . }}
    {{ end }}
  </div>
  {{ partial "pagination.html" $paginator }}
</div>
{{ end }}
