# =============================================================================
# Paul的技术博客 — Hugo + Toha v4 配置
# =============================================================================
baseURL: https://dkisser.cn/

locale: zh-CN
title: "Paul的技术博客"
defaultContentLanguage: zh-cn

# Use Hugo modules to add theme
module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    # 注意: 一旦自定义 mounts，Hugo 默认挂载(static/assets 等)会被移除，需显式补回
    - source: static
      target: static
    - source: assets
      target: assets
    - source: ./node_modules/flag-icons/flags
      target: static/flags
    - source: ./node_modules/@fontsource/mulish/files
      target: static/files
    - source: ./node_modules/katex/dist/fonts
      target: static/fonts

languages:
  zh-cn:
    locale: zh-CN
    label: 简体中文
    title: "Paul的技术博客"
    weight: 1

# Allow raw html in markdown file
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    style: monokai

# 输出：HTML + RSS。不输出 JSON —— 本站关闭 Toha 内置 Fuse.js 搜索，
# 改用 Pagefind（见 content/search.md 与 package.json 的 build 脚本）。
outputs:
  home:
    - HTML
    - RSS

# RSS 输出文件名保持默认 index.xml
outputFormats:
  rss:
    baseName: index

enableEmoji: true

# <!--more--> 手动摘要分隔符生效（Hugo 默认支持）；自动摘要长度兜底
summaryLength: 70

sitemap:
  changefreq: monthly
  priority: 0.5
  filename: sitemap.xml
  disable: false

# Site parameters
params:
  # TODO: 替换为真实站点背景图（放在 static/images/site/ 下）
  background: /images/default-background.jpg

  # TODO: 替换为真实 logo / favicon（放在 static/images/site/ 下）
  logo:
    main: /images/main-logo.png
    inverted: /images/inverted-logo.png
    favicon: /images/favicon.png

  # 本博客源码仓库地址
  gitRepo: https://github.com/dkisser/paul_blog
  gitBranch: main

  topNavbar:
    maxVisibleSections: 5

  features:
    theme:
      enable: true
      services:
        light: true
        dark: true
        default: system

    portfolio:
      enable: true

    blog:
      enable: true
      showAuthor: true
      shareButtons:
        facebook: false
        twitter: false
        linkedin: false
        reddit: false
        whatsapp: false
        email: true

    notes:
      enable: false

    comment:
      enable: false

    analytics:
      enable: true
      services:
        # Toha v4.16.0 的 analytics.html 在 services 层还要求 enable 标记（新版主题已移除该判断）
        enable: true
        umami:
          # 只走 Caddy 放行的采集端点；script.js 路径与 Caddyfile matcher 一致
          scheme: https
          instance: stats.dkisser.cn
          id: 47d19573-f32e-46b1-8647-a73accac22e5

    support:
      enable: false

    toc:
      enable: true

    tags:
      enable: true
      on_card: true

    flags:
      enable: false

    embedpdf:
      enable: false

    # Mermaid 流程图
    flowchart:
      enable: true
      services:
        mermaid:
          theme: default
          darkTheme: dark

    # KaTeX 数学公式
    math:
      enable: true
      services:
        katex:
          delimiters:
            - left: $$
              right: $$
              display: true
            - left: \\[
              right: \\]
              display: true
            - left: $
              right: $
              display: false
            - left: \\(
              right: \\)
              display: false

    # highlight.js 语法高亮（在 Hugo 内建高亮之上再做一层）
    syntaxHighlight:
      enable: true
      services:
        hljs:
          noHighlightRe: /^no-highlight$/i

    videoPlayer:
      enable: false

    copyCodeButton:
      enable: true

    readingTime:
      enable: true

    showDate:
      enable: true

    pagination:
      maxPostsPerPage: 12

  footer:
    enable: true
    template: footer.html
    navigation:
      enable: true
      customMenus: true
    contactMe:
      enable: true
    credentials:
      enable: true
    newsletter:
      enable: false
    disclaimer:
      enable: false
