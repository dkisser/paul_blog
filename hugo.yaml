# =============================================================================
# Paul的技术博客 — Hugo 配置（自研主题，无外部 theme / Hugo Module 依赖）
# 分区：站点级 → 语言 → markup → 输出 → taxonomy/related → 前端依赖挂载区 → 自有参数
# =============================================================================

# ─────────────────────────────── 站点级 ───────────────────────────────
baseURL: https://dkisser.cn/
title: "Paul的技术博客"
defaultContentLanguage: zh-cn
enableEmoji: true

# <!--more--> 手动摘要分隔符生效（Hugo 默认支持）；自动摘要长度兜底
summaryLength: 70

# 列表分页规格（文章列表页）
pagination:
  pagerSize: 12

sitemap:
  changefreq: monthly
  priority: 0.5
  filename: sitemap.xml
  disable: false

languages:
  zh-cn:
    locale: zh-CN
    label: 简体中文
    title: "Paul的技术博客"
    weight: 1

# ─────────────────────────────── markup ───────────────────────────────
# goldmark 允许内嵌 HTML；代码高亮走 Chroma class 模式（noClasses: false），
# 双主题高亮样式表在 assets/css/main.src.css 中（html.dark 前缀区分）。
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1
    endLevel: 2
    ordered: false
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    noClasses: false

# ─────────────────────────────── 输出 ───────────────────────────────
# HTML + RSS；不输出 JSON（站内搜索用 Pagefind，构建后索引 public/）。
outputs:
  home:
    - HTML
    - RSS

# RSS 输出文件名保持默认 index.xml
outputFormats:
  rss:
    baseName: index

# ──────────────────────── taxonomy / related ────────────────────────
taxonomies:
  category: categories
  tag: tags

# 文章页侧栏"推荐阅读"：优先同分类、同标签，日期近者优先（tags 数据 P2 补全后生效）
related:
  includeNewer: true
  threshold: 80
  indices:
    - name: categories
      weight: 100
    - name: tags
      weight: 80
    - name: date
      weight: 10

# ──────────────── 前端依赖挂载区（node_modules → 站点） ────────────────
# 注意: 一旦自定义 mounts，Hugo 默认挂载(static/assets 等)会被移除，需显式补回。
# 此处是全站唯一引用 node_modules 的地方；新增前端依赖时在本区追加。
# 单文件挂载需 Hugo ≥ 0.75（本站 0.165.0，已实测）。
module:
  mounts:
    - source: static
      target: static
    - source: assets
      target: assets
    # 字体：@fontsource 自托管（@font-face 见 assets/css/main.src.css）
    - source: ./node_modules/@fontsource/inter/files
      target: static/fonts/inter
    - source: ./node_modules/@fontsource/jetbrains-mono/files
      target: static/fonts/jetbrains-mono
    # KaTeX 完整 dist（css + fonts + js 同目录相对解析）；
    # 仅 front matter `math: true` 的页面加载（/katex/katex.min.css + katex.min.js + contrib/auto-render.min.js）
    - source: ./node_modules/katex/dist
      target: static/katex
    # Mermaid：仅 front matter `mermaid: true` 的页面加载，经 Hugo Pipes 指纹化
    - source: ./node_modules/mermaid/dist/mermaid.min.js
      target: assets/js/vendor/mermaid.min.js
    # TypeIt：仅首页打字机加载，经 Hugo Pipes 指纹化
    - source: ./node_modules/typeit/dist/index.umd.js
      target: assets/js/vendor/typeit.umd.js

# ─────────────────────────────── 自有参数 ───────────────────────────────
# 站点数据集中在 data/（site.yaml / author.yaml / home.yaml），此处只留少量全局参数。
params:
  description: Paul 的技术博客 — Java / 微服务 / 云原生技术分享。
